<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Services Hero Section</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVBAR -->
    <header class="navbar">
        <div class="nav-container">
            <!-- Logo on the left -->
            <div class="logo">
                <img class="logoPng" src="logo.png" alt="logo" height="30px">
            </div>
            
            <!-- Navigation Links -->
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
            
            <!-- User Name on the far right -->
            <div class="user-profile">
                <span class="username">Vijay Verma</span>
            </div>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero-section">
        <div class="hero-container">
            
            <!-- Left Div: Content -->
            <div class="hero-left">
                <div class="hero-content-wrapper">
                    <h1>Revitalize Your <br>Clothes with Expert <br><span class="highlight">Laundry Services!</span></h1>
                    <p>From premium dry cleaning to swift wash and fold, we deliver care and convenience. Schedule a pickup and rediscover the freshness of your clothes today!</p>
                    <button class="cta-btn">Book a service today!</button>
                </div>
            </div><!--
            
            Eliminate whitespace between inline-block divs
            
            --><!-- Right Div: Image -->
            <div class="hero-right">
                <img src="image.jpg" alt="Laundry Machine Illustration">
            </div>

        </div>
    </section>    
</body>
</html>
